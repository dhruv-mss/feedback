<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>hoblie - a quick thing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9F0;
    --bg-deep:#F3E9DB;
    --card:#FFFFFF;
    --ink:#1B1815;
    --ink-muted:#847A6E;
    --pink:#EF4B8E;
    --pink-dark:#CE3172;
    --pink-soft:#FCE1EC;
    --teal:#1FBFB8;
    --teal-dark:#158E89;
    --teal-soft:#DEF6F4;
    --ring: rgba(239,75,142,0.22);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: none;
  }
  body{
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:stretch;
  }
  .app-shell{
    width:100%;
    max-width:560px;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding: 20px 22px 28px;
  }
  @media (min-width:640px){
    body{ align-items:center; padding:24px 0;}
    .app-shell{
      min-height: min(820px, 92dvh);
      border-radius:28px;
      box-shadow: 0 30px 60px -25px rgba(43,36,32,0.25), 0 2px 8px rgba(43,36,32,0.06);
      background: var(--bg);
      overflow:hidden;
    }
  }

  /* top bar: back button + progress */
  .topbar{
    display:flex;
    align-items:center;
    gap:14px;
    height:40px;
    flex-shrink:0;
  }
  .back-btn{
    width:36px; height:36px;
    border-radius:50%;
    border:none;
    background: var(--bg-deep);
    color: var(--ink);
    font-size:18px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    opacity:0; pointer-events:none;
    transition: opacity .25s ease, transform .15s ease;
    flex-shrink:0;
  }
  .back-btn.visible{ opacity:1; pointer-events:auto; }
  .back-btn:active{ transform: scale(0.9); }

  .progress-blocks{
    display:flex;
    gap:5px;
    flex:1;
    flex-wrap:wrap;
  }
  .progress-blocks .blk{
    width:16px; height:8px;
    border-radius:3px;
    background: var(--bg-deep);
    transition: background .35s ease, transform .3s ease;
  }
  .progress-blocks .blk.filled{
    background: var(--pink);
  }
  .progress-blocks .blk.just-filled{
    animation: popBlock .4s ease;
  }
  @keyframes popBlock{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.35); }
    100%{ transform: scale(1); }
  }

  /* stage */
  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding-top: 18px;
  }
  .screen{
    opacity:0;
    transform: translateY(14px);
    transition: opacity .4s cubic-bezier(.22,.61,.36,1), transform .4s cubic-bezier(.22,.61,.36,1);
  }
  .screen.active{ opacity:1; transform:translateY(0); }
  .screen.leaving{ opacity:0; transform: translateY(-14px); }
  .screen.back-entering{ transform: translateY(-14px); }
  .screen.back-entering.active{ transform: translateY(0); }

  .eyebrow{
    font-size:13px;
    font-weight:700;
    letter-spacing:.02em;
    text-transform: uppercase;
    color: var(--teal-dark);
    margin:0 0 10px;
  }
  h1, h2{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    line-height:1.24;
    margin:0 0 10px;
    color:var(--ink);
  }
  h1{ font-size: clamp(26px, 6.5vw, 32px); }
  h2{ font-size: clamp(22px, 5.6vw, 27px); }
  p.help{
    font-size:15px;
    color: var(--ink-muted);
    line-height:1.5;
    margin:0 0 22px;
  }
  .lede{
    font-size:16px;
    line-height:1.6;
    color: var(--ink);
    margin: 0 0 8px;
  }

  textarea.answer{
    width:100%;
    min-height:120px;
    resize:vertical;
    border:2px solid var(--bg-deep);
    background: var(--card);
    border-radius:18px;
    padding:16px 18px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    line-height:1.5;
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  textarea.answer:focus{
    border-color: var(--pink);
    box-shadow: 0 0 0 5px var(--ring);
  }
  input.answer{
    width:100%;
    border:2px solid var(--bg-deep);
    background: var(--card);
    border-radius:999px;
    padding:14px 20px;
    font-family:'Inter',sans-serif;
    font-size:16px;
    color:var(--ink);
    outline:none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input.answer:focus{
    border-color: var(--pink);
    box-shadow: 0 0 0 5px var(--ring);
  }
  label.field-label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--ink-muted);
    margin: 0 0 6px 4px;
  }
  .field{ margin-bottom:16px; }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:16px;
    border-radius:999px;
    padding:15px 28px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    transition: transform .12s ease, box-shadow .2s ease, opacity .2s ease;
  }
  .btn-primary{
    background: var(--pink);
    color: #fff8f2;
    box-shadow: 0 10px 22px -10px rgba(193,89,45,0.55);
    width:100%;
  }
  .btn-primary:disabled{
    opacity:.4;
    cursor:not-allowed;
    box-shadow:none;
  }
  .btn-primary.pressed{ animation: btnBounce .32s ease; }
  @keyframes btnBounce{
    0%{ transform:scale(1); }
    45%{ transform:scale(0.94); }
    100%{ transform:scale(1); }
  }
  .btn-primary:active{ transform:scale(0.97); }

  .skip-link{
    display:block;
    text-align:center;
    margin-top:14px;
    color: var(--ink-muted);
    font-size:14px;
    text-decoration:underline;
    cursor:pointer;
    background:none; border:none; font-family:inherit;
  }

  .actions{ margin-top:22px; }

  /* choice pills */
  .choice-list{ display:flex; flex-direction:column; gap:12px; margin-top:6px; }
  .choice-pill{
    display:flex;
    align-items:center;
    gap:12px;
    background: var(--card);
    border:2px solid var(--bg-deep);
    border-radius:20px;
    padding:16px 18px;
    font-size:16.5px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    text-align:left;
    transition: border-color .18s ease, transform .12s ease, background .18s ease;
  }
  .choice-pill .emoji{ font-size:22px; flex-shrink:0; }
  .choice-pill:active{ transform: scale(0.98); }
  .choice-pill:hover{ border-color: var(--pink); }
  .choice-pill.selected{
    border-color: var(--pink);
    background: var(--pink-soft);
    animation: btnBounce .32s ease;
  }

  /* chips: same look as choice-pill, smaller and inline-wrapping */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:44px;
    background: var(--card);
    border:2px solid var(--bg-deep);
    border-radius:999px;
    padding:9px 16px;
    font-size:14.5px;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    text-align:center;
    transition: border-color .18s ease, transform .12s ease, background .18s ease;
  }
  .chip:active{ transform: scale(0.96); }
  .chip:hover{ border-color: var(--pink); }
  .chip.selected{
    border-color: var(--pink);
    background: var(--pink-soft);
    animation: btnBounce .32s ease;
  }

  .center-copy{
    text-align:center;
  }
  .center-copy .btn-primary{ margin-top:26px; }

  .brandmark{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size:19px;
    letter-spacing:-0.01em;
    color: var(--pink);
    margin-bottom: 18px;
  }

  .ticker{
    overflow:hidden;
    border-radius:999px;
    padding:9px 0;
    margin-bottom:24px;
  }
  .ticker.pink{ background: var(--pink); }
  .ticker.teal{ background: var(--teal); }
  .ticker-inner{
    display:flex;
    width:max-content;
    animation: tickerScroll 18s linear infinite;
  }
  .ticker-item{
    color:#fff;
    font-family:'Inter',sans-serif;
    font-size:11px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    white-space:nowrap;
    padding:0 14px;
  }
  .ticker-item:not(:last-child)::after{ content:'\2022'; margin-left:14px; color: rgba(255,255,255,0.55); }
  @keyframes tickerScroll{ from{ transform:translateX(0); } to{ transform:translateX(-50%); } }

  .conditional-field{
    max-height:0;
    overflow:hidden;
    opacity:0;
    transition: max-height .35s ease, opacity .3s ease, margin .35s ease;
  }
  .conditional-field.open{
    max-height:160px;
    opacity:1;
    margin-top:16px;
  }

  .error-msg{
    color: var(--pink-dark);
    font-size:14px;
    margin-top:10px;
    display:none;
  }
  .error-msg.show{ display:block; }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,0.4);
    border-top-color:#fff;
    animation: spin .7s linear infinite;
    display:none;
  }
  .spinner.show{ display:inline-block; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .final-emoji{ font-size:44px; margin-bottom:6px; }

  ::selection{ background: var(--pink-soft); }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <button class="back-btn" id="backBtn" aria-label="Go back">←</button>
    <div class="progress-blocks" id="progressBlocks"></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script type="module">
// ---- Supabase config -------------------------------------------------
// Replace these with your project's values (Settings -> API in Supabase).
// The anon/public key is safe to expose in client-side code: access is
// controlled by the Row Level Security policies in supabase/schema.sql.
const SUPABASE_URL = "https://rjasrucloiozbvvmouuu.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_nToADn1Ma-2ILahQkOf64w_QTSKiRG8";

const isConfigured = !SUPABASE_URL.includes("YOUR_SUPABASE_URL") && !SUPABASE_ANON_KEY.includes("YOUR_SUPABASE_ANON_KEY");
let supabase = null;

// Loaded lazily via dynamic import so a blocked/offline CDN can never break
// the form itself: submitResponse() falls back to localStorage if this
// never resolves.
async function initSupabase() {
  if (!isConfigured) {
    console.warn("hoblie form: Supabase isn't configured yet. See README.md. Responses will be saved to localStorage only, as a backup.");
    return;
  }
  try {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  } catch (e) {
    console.error('hoblie form: could not load Supabase client, falling back to localStorage.', e);
  }
}
const supabaseReady = initSupabase();

// ---- state ------------------------------------------------------------
const answers = {};
const historyStack = [];
const shuffleCache = {};
let currentId = null;
let branchName = null; // 'made' | 'not_yet'
let startedAt = Date.now();

// Identifies this respondent's row in Supabase so repeated partial saves
// upsert the same row instead of creating duplicates. Generated once per
// session and carried through resume via saveState()/loadState().
function generateId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
let sessionId = null;

// Every screen the respondent can actually see, in order, per branch.
// The progress bar's length always matches whichever of these is active.
const MADE_PATH = [
  'q_made', 'q_experience', 'q_liked_most', 'q_where_now', 'q_time_taken', 'q_alone_or_with',
  'bridge', 'q_point_of_entry', 'q_process_output', 'q_what_else_make', 'q_stuck_moment',
  'q_how_it_felt', 'q_wall_1', 'q_wall_2', 'q_traits', 'q_call', 'q_anything_else', 'contact'
];
const NOT_YET_PATH = [
  'q_made', 'd1', 'd2', 'd3',
  'bridge', 'q_point_of_entry', 'q_process_output', 'q_what_else_make',
  'q_wall_1', 'q_wall_2', 'q_traits', 'q_call', 'q_anything_else', 'contact'
];
let currentPath = MADE_PATH;

// ---- save / resume progress -------------------------------------------
const STORAGE_KEY = 'hoblie_feedback_progress_v2';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      answers, historyStack, currentId, shuffleCache, startedAt, branchName, sessionId
    }));
  } catch (e) { /* ignore quota/private-mode errors */ }
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function clearState() {
  try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
}

const stage = document.getElementById('stage');
const backBtn = document.getElementById('backBtn');
const progressBlocksEl = document.getElementById('progressBlocks');

let renderedBlockCount = 0;
function ensureBlockCount(n) {
  if (renderedBlockCount === n) return;
  progressBlocksEl.innerHTML = '';
  for (let i = 0; i < n; i++) {
    const b = document.createElement('div');
    b.className = 'blk';
    progressBlocksEl.appendChild(b);
  }
  renderedBlockCount = n;
}

function updateProgress(id) {
  if (id === 'intro') {
    progressBlocksEl.style.visibility = 'hidden';
    return;
  }
  progressBlocksEl.style.visibility = 'visible';
  const total = currentPath.length;
  ensureBlockCount(total);
  let idx = id === 'thankyou' ? total - 1 : currentPath.indexOf(id);
  if (idx === -1) idx = 0;
  const blocks = progressBlocksEl.querySelectorAll('.blk');
  blocks.forEach((b, i) => {
    const shouldFill = i <= idx;
    const wasFilled = b.classList.contains('filled');
    b.classList.toggle('filled', shouldFill);
    if (shouldFill && !wasFilled) {
      b.classList.add('just-filled');
      setTimeout(() => b.classList.remove('just-filled'), 400);
    }
  });
}

backBtn.addEventListener('click', () => {
  if (historyStack.length < 2) return;
  historyStack.pop();
  const prevId = historyStack[historyStack.length - 1];
  render(prevId, { direction: 'back' });
});

function goTo(id, opts = {}) {
  if (opts.pushHistory !== false) historyStack.push(id);
  render(id, { direction: 'forward' });
}

function render(id, { direction }) {
  currentId = id;
  backBtn.classList.toggle('visible', historyStack.length > 1 && id !== 'thankyou');
  updateProgress(id);
  if (id === 'thankyou') clearState(); else saveState();
  if (id !== 'intro' && id !== 'thankyou') syncProgress();

  const outgoing = stage.querySelector('.screen.active');
  const build = () => {
    stage.innerHTML = '';
    const el = document.createElement('div');
    el.className = 'screen';
    if (direction === 'back') el.classList.add('back-entering');
    stage.appendChild(el);
    SCREENS[id](el);
    requestAnimationFrame(() => el.classList.add('active'));
  };

  if (outgoing) {
    outgoing.classList.remove('active');
    outgoing.classList.add('leaving');
    setTimeout(build, 220);
  } else {
    build();
  }
}

function pressBounce(btn) {
  btn.classList.remove('pressed');
  void btn.offsetWidth;
  btn.classList.add('pressed');
}

function buildTicker(items, color) {
  const wrap = document.createElement('div');
  wrap.className = `ticker ${color}`;
  const inner = document.createElement('div');
  inner.className = 'ticker-inner';
  for (let rep = 0; rep < 2; rep++) {
    items.forEach(text => {
      const span = document.createElement('span');
      span.className = 'ticker-item';
      span.textContent = text;
      inner.appendChild(span);
    });
  }
  wrap.appendChild(inner);
  return wrap;
}

function shuffleWithPinnedLast(values, pinnedLast) {
  const pinned = values.filter(v => pinnedLast.includes(v));
  const rest = values.filter(v => !pinnedLast.includes(v));
  for (let i = rest.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [rest[i], rest[j]] = [rest[j], rest[i]];
  }
  return [...rest, ...pinned];
}

// ---- reusable screen builders ------------------------------------------

function renderChoiceScreen(container, { eyebrow, question, help, options, onPick }) {
  if (eyebrow) {
    const e = document.createElement('p');
    e.className = 'eyebrow'; e.textContent = eyebrow;
    container.appendChild(e);
  }
  const h = document.createElement('h1');
  h.textContent = question;
  container.appendChild(h);
  if (help) {
    const p = document.createElement('p');
    p.className = 'help'; p.textContent = help;
    container.appendChild(p);
  }
  const list = document.createElement('div');
  list.className = 'choice-list';
  options.forEach(opt => {
    const pill = document.createElement('button');
    pill.className = 'choice-pill';
    pill.innerHTML = (opt.emoji ? `<span class="emoji">${opt.emoji}</span>` : '') + `<span>${opt.label}</span>`;
    pill.addEventListener('click', () => {
      list.querySelectorAll('.choice-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      setTimeout(() => onPick(opt.value), 320);
    });
    list.appendChild(pill);
  });
  container.appendChild(list);
}

function renderTextScreen(container, { eyebrow, question, help, key, placeholder, optional, nextId, onNext }) {
  if (eyebrow) {
    const e = document.createElement('p');
    e.className = 'eyebrow'; e.textContent = eyebrow;
    container.appendChild(e);
  }
  const h = document.createElement('h1');
  h.textContent = question;
  container.appendChild(h);
  if (help) {
    const p = document.createElement('p');
    p.className = 'help'; p.textContent = help;
    container.appendChild(p);
  }
  const ta = document.createElement('textarea');
  ta.className = 'answer';
  ta.placeholder = placeholder || 'Type your answer…';
  ta.value = answers[key] || '';
  container.appendChild(ta);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const btn = document.createElement('button');
  btn.className = 'btn btn-primary';
  btn.textContent = 'Continue';
  btn.disabled = !optional && !ta.value.trim();
  actions.appendChild(btn);
  container.appendChild(actions);

  if (!optional) {
    ta.addEventListener('input', () => { btn.disabled = !ta.value.trim(); });
  }

  const proceed = () => {
    answers[key] = ta.value.trim();
    pressBounce(btn);
    setTimeout(() => (onNext ? onNext() : goTo(nextId)), 160);
  };
  btn.addEventListener('click', proceed);

  if (optional) {
    const skip = document.createElement('button');
    skip.className = 'skip-link';
    skip.textContent = 'Skip this one';
    skip.addEventListener('click', () => {
      answers[key] = ta.value.trim();
      onNext ? onNext() : goTo(nextId);
    });
    container.appendChild(skip);
  }

  setTimeout(() => ta.focus(), 350);
}

// Single- or multi-select chips/pills, with an optional one-line or open
// follow-up field. Covers every "tap first, write only if you want" screen.
function renderSelectScreen(container, {
  eyebrow, question, help, options, shuffleKey, pinnedLast = [],
  variant = 'pill', multi = false, required = false,
  valueKey, orderKey, followUp, nextId
}) {
  if (eyebrow) {
    const e = document.createElement('p');
    e.className = 'eyebrow'; e.textContent = eyebrow;
    container.appendChild(e);
  }
  const h = document.createElement('h1');
  h.textContent = question;
  container.appendChild(h);
  if (help) {
    const p = document.createElement('p');
    p.className = 'help'; p.textContent = help;
    container.appendChild(p);
  }

  let displayOptions = options;
  if (shuffleKey) {
    if (!shuffleCache[shuffleKey]) {
      shuffleCache[shuffleKey] = shuffleWithPinnedLast(options.map(o => o.value), pinnedLast);
    }
    const order = shuffleCache[shuffleKey];
    displayOptions = order.map(v => options.find(o => o.value === v));
  }

  const existing = answers[valueKey];
  const selected = multi ? new Set(Array.isArray(existing) ? existing : []) : (existing || null);
  let singleSelected = multi ? null : selected;

  const list = document.createElement('div');
  list.className = variant === 'chip' ? 'chip-row' : 'choice-list';
  container.appendChild(list);

  const actions = document.createElement('div');
  actions.className = 'actions';
  const continueBtn = document.createElement('button');
  continueBtn.className = 'btn btn-primary';
  continueBtn.textContent = 'Continue';

  let followUpEl = null;
  let followUpWrap = null;
  if (followUp) {
    followUpWrap = document.createElement('div');
    followUpWrap.className = followUp.revealOnSelect ? 'conditional-field' : 'field';
    const label = document.createElement('label');
    label.className = 'field-label';
    label.textContent = followUp.label;
    followUpWrap.appendChild(label);
    followUpEl = document.createElement(followUp.type === 'textarea' ? 'textarea' : 'input');
    followUpEl.className = 'answer';
    if (followUp.type === 'textarea') followUpEl.style.minHeight = '90px';
    followUpEl.placeholder = followUp.placeholder || '';
    followUpEl.value = answers[followUp.key] || '';
    followUpWrap.appendChild(followUpEl);
  }

  function hasSelection() {
    return multi ? selected.size > 0 : !!singleSelected;
  }
  function refreshContinue() {
    continueBtn.disabled = required && !hasSelection();
  }

  displayOptions.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = variant === 'chip' ? 'chip' : 'choice-pill';
    btn.textContent = opt.label;
    if (multi ? selected.has(opt.value) : singleSelected === opt.value) btn.classList.add('selected');
    btn.addEventListener('click', () => {
      if (multi) {
        if (selected.has(opt.value)) { selected.delete(opt.value); btn.classList.remove('selected'); }
        else { selected.add(opt.value); btn.classList.add('selected'); }
      } else {
        list.querySelectorAll(`.${variant === 'chip' ? 'chip' : 'choice-pill'}`).forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        singleSelected = opt.value;
        if (followUp && followUp.revealOnSelect) {
          followUpWrap.classList.add('open');
          setTimeout(() => followUpEl.focus(), 380);
        }
      }
      refreshContinue();
    });
    list.appendChild(btn);
  });

  if (followUp && followUp.revealOnSelect && singleSelected) followUpWrap.classList.add('open');
  if (followUpWrap) container.appendChild(followUpWrap);

  refreshContinue();
  actions.appendChild(continueBtn);
  container.appendChild(actions);

  continueBtn.addEventListener('click', () => {
    answers[valueKey] = multi ? Array.from(selected) : singleSelected;
    if (orderKey) answers[orderKey] = displayOptions.map(o => o.value);
    if (followUp) answers[followUp.key] = followUpEl.value.trim();
    pressBounce(continueBtn);
    const dest = typeof nextId === 'function' ? nextId(answers) : nextId;
    setTimeout(() => goTo(dest), 160);
  });
}

    branch: answers.branch || null,
    made_kit: answers.made_kit || null,

    not_yet_open_note: answers.not_yet_open_note || null,
    point_of_entry: answers.point_of_entry || null,
    point_of_entry_detail: answers.point_of_entry_detail || null,
    point_of_entry_order: answers.point_of_entry_order || null,

  };

// Fire-and-forget partial save: upserts the same row (matched by
// sessionId) every time the respondent moves to a new screen, so
// someone who closes the tab halfway still leaves real data behind.
// Never blocks navigation and never surfaces errors to the user.
//
// This goes through the save_response() Postgres function rather than a
// direct table upsert. Postgres RLS needs SELECT-level visibility to
// resolve an upsert's ON CONFLICT check, and a public SELECT policy for
// anon would let anyone holding the public key read every respondent's
// answers. Routing writes through a SECURITY DEFINER function avoids that:
// anon can save a response but has no direct table access at all.
async function syncProgress() {
  if (!isConfigured) return;
  try {
    await supabaseReady;
    if (!supabase) return;
    const { error } = await supabase.rpc('save_response', { payload: buildPayload(false) });
    if (error) console.error('hoblie form: partial save failed, will retry on next screen.', error);
  } catch (e) {
    console.error('hoblie form: partial save failed, will retry on next screen.', e);
  }
}

async function submitResponse() {
  await supabaseReady;
  const payload = buildPayload(true);

  if (!isConfigured || !supabase) {
    try {
      const backup = JSON.parse(localStorage.getItem('hoblie_responses') || '[]');
      backup.push({ ...payload, saved_at: new Date().toISOString() });
      localStorage.setItem('hoblie_responses', JSON.stringify(backup));
    } catch (e) { console.error(e); }
    return true;
  }

  const { error } = await supabase.rpc('save_response', { payload });
  if (error) {
    console.error('Supabase save_response failed:', error);
    return false;
  }
  return true;
}

// ---- kick off, resuming a saved session if one exists ------------------
(function bootstrap() {
  const saved = loadState();
  const resumable = saved && saved.currentId && saved.currentId !== 'intro' && saved.currentId !== 'thankyou'
    && Array.isArray(saved.historyStack) && saved.historyStack.length && SCREENS[saved.currentId];

  if (resumable) {
    Object.assign(answers, saved.answers || {});
    historyStack.push(...saved.historyStack);
    Object.assign(shuffleCache, saved.shuffleCache || {});
    branchName = saved.branchName || null;
    currentPath = branchName === 'not_yet' ? NOT_YET_PATH : MADE_PATH;
    startedAt = saved.startedAt || Date.now();
    sessionId = saved.sessionId || generateId();
    render(saved.currentId, { direction: 'forward' });
    return;
  }

  startedAt = Date.now();
  sessionId = generateId();
  goTo('intro');
})();
</script>
