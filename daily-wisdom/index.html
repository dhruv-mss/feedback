<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Daily Wisdom &mdash; Rajyogi Narendraji's 100 Principles</title>
<meta name="description" content="One life principle a day from Pujya Shri Rajyogi Narendraji">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7A2E33">
<link rel="icon" href="icons/favicon-48.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily Wisdom">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== LANGUAGE CHOICE (first ever visit) ===================== -->
<section id="screen-language" class="screen" hidden>
  <div class="center-card">
    <div class="glyph">ॐ મા ॐ</div>
    <h1 class="app-name">Daily Wisdom<br><span class="gu">રોજનું જ્ઞાન</span></h1>
    <p class="app-tagline">Rajyogi Narendraji's 100 Principles<br><span class="gu">પૂજ્ય શ્રી રાજયોગી નરેન્દ્રજીના<br>શબ્દ-પુષ્પની પાંખડીયો</span></p>
    <p class="muted">Please choose the language you'd like to read in.<br>કૃપા કરી તમે જે ભાષામાં વાંચવા ઈચ્છો છો તે પસંદ કરો.</p>
    <div class="choice-buttons">
      <button class="btn btn-primary btn-lang" data-lang="gu">ગુજરાતી</button>
      <button class="btn btn-primary btn-lang" data-lang="en">English</button>
    </div>
  </div>
</section>

<!-- ===================== ONBOARDING (first ever visit, after language) ===================== -->
<section id="screen-onboarding" class="screen" hidden>
  <div class="center-card">
    <div class="glyph">ॐ મા ॐ</div>
    <h1 id="ob-title" class="screen-title"></h1>
    <div id="ob-body" class="onboarding-body"></div>
    <button id="ob-continue" class="btn btn-primary btn-wide"></button>
  </div>
</section>

<!-- ===================== INSTALL PROMPT (first ever visit, once) ===================== -->
<section id="screen-install" class="screen" hidden>
  <div class="center-card">
    <div class="glyph">ॐ મા ॐ</div>
    <h1 id="install-title" class="screen-title"></h1>
    <p id="install-body" class="onboarding-body"></p>
    <p id="install-ios-note" class="muted" hidden></p>
    <div class="choice-buttons">
      <button id="install-btn" class="btn btn-primary btn-wide"></button>
      <button id="install-not-now" class="btn btn-secondary btn-wide"></button>
    </div>
  </div>
</section>

<!-- ===================== HOME (daily principle) ===================== -->
<section id="screen-home" class="screen" hidden>
  <header class="topbar">
    <span id="home-app-name" class="brand"></span>
    <button id="lang-toggle" class="btn btn-toggle" aria-label="Switch language"></button>
  </header>

  <main class="content">
    <p id="home-date" class="date-label"></p>

    <div class="principle-card">
      <p id="principle-number" class="principle-number"></p>
      <p id="principle-text" class="principle-text"></p>
      <p id="ai-note" class="ai-note" hidden></p>
    </div>

    <div class="checkin-card">
      <p id="checkin-question" class="checkin-question"></p>
      <div id="checkin-options" class="checkin-options"></div>
      <p id="checkin-thanks" class="checkin-thanks" hidden></p>
    </div>

    <div class="streak-card">
      <p id="streak-main" class="streak-main"></p>
      <p id="streak-longest" class="streak-longest"></p>
      <p id="last30-heading" class="last30-heading"></p>
      <div id="dot-grid" class="dot-grid"></div>
    </div>

    <button id="btn-read-all" class="btn btn-secondary btn-wide"></button>
  </main>

  <footer class="footer">
    <span id="footer-credit"></span>
  </footer>
</section>

<!-- ===================== READ ALL 100 ===================== -->
<section id="screen-readall" class="screen" hidden>
  <header class="topbar">
    <button id="readall-back" class="btn btn-toggle" aria-label="Back"></button>
    <span id="readall-title" class="brand"></span>
    <button id="readall-lang-toggle" class="btn btn-toggle" aria-label="Switch language"></button>
  </header>
  <main class="content">
    <div id="readall-list" class="readall-list"></div>
  </main>
</section>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
